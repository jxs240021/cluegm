<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just One - Party Game</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #2d3748; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 500px; margin: 0 auto 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1, h2, h3 { text-align: center; color: #1a202c; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 16px; }
    button { background: #3182ce; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2b6cb0; }
    .btn-category { background: #2b6cb0; margin-bottom: 10px; }
    .btn-category:hover { background: #2c5282; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 14px; background: #e2e8f0; }
    .clue-item { background: #edf2f7; padding: 10px; margin: 6px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .clue-item.invalid { text-decoration: line-through; opacity: 0.5; background: #fed7d7; }
    ul { list-style: none; padding: 0; }
  </style>
</head>
<body>

  <!-- Join / Create Screen -->
  <div id="join-screen" class="card">
    <h1>🎯 Just One</h1>
    <input type="text" id="player-name" placeholder="Enter Your Name">
    <button id="create-btn">Create New Room</button>
    <div style="text-align: center; margin: 12px 0;">— OR —</div>
    <input type="text" id="room-input" placeholder="Enter 4-Letter Room Code">
    <button id="join-btn">Join Room</button>
  </div>

  <!-- Main Game Screen -->
  <div id="game-screen" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="badge" id="player-name-badge"></span>
      <span class="badge" style="background:#feebc8; color:#9c4221;" id="room-code-display"></span>
    </div>
    <h3 id="role-display" style="color: #4a5568; margin-top: 15px;"></h3>
    <button id="copy-link-btn" style="background: #4a5568; margin-bottom: 15px;">📋 Copy Invite Link</button>

    <!-- Lobby View -->
    <div id="lobby-list-container">
      <h3>Connected Players:</h3>
      <ul id="lobby-player-list"></ul>
      <button id="start-game-btn" style="display: none; background: #38a169;">🚀 Start Game</button>
    </div>

    <!-- Phase 0: Selecting Category -->
    <div id="selecting-category-view" style="display: none;">
      <h2 id="category-picker-title">Selecting Category...</h2>
      <p id="category-instruction-text" style="text-align: center; color: #718096;"></p>
      <div id="category-buttons-container"></div>
    </div>

    <!-- Phase 1: Submitting Clues -->
    <div id="submitting-clues-view" style="display: none;">
      <p style="text-align: center; font-size: 14px; color: #718096;" id="category-badge-display"></p>
      <h2 id="target-word-display" style="letter-spacing: 2px;"></h2>
      <div id="clue-input-box">
        <input type="text" id="clue-input" placeholder="Type a ONE-WORD clue">
        <button id="submit-clue-btn">Submit Clue</button>
      </div>
      <p id="waiting-clues-msg" style="text-align: center; font-style: italic; color: #718096;"></p>
    </div>

    <!-- Phase 2: Reviewing Clues -->
    <div id="reviewing-clues-view" style="display: none;">
      <h2>Moderation Phase</h2>
      <p id="mod-instruction-text" style="text-align: center; color: #718096;"></p>
      <div id="moderator-clue-list"></div>
      <button id="approve-clues-btn" style="background: #38a169; display: none;">✅ Approve & Show Guesser</button>
    </div>

    <!-- Phase 3: Guessing Phase -->
    <div id="guessing-view" style="display: none;">
      <h2>Guesser Phase</h2>
      <h3>Approved Clues:</h3>
      <ul id="guesser-clue-list"></ul>
      <div id="guesser-input-box">
        <input type="text" id="guess-input" placeholder="Type your guess">
        <button id="submit-guess-btn">Submit Final Guess</button>
      </div>
    </div>

    <!-- Phase 4: Round Over -->
    <div id="round-over-view" style="display: none; text-align: center;">
      <h2 id="result-status"></h2>
      <p>Target Word: <strong id="reveal-target"></strong></p>
      <p>Submitted Guess: <strong id="reveal-guess"></strong></p>
      <button id="next-round-btn">Next Round ➔</button>
    </div>

    <!-- Scoreboard -->
    <div id="scoreboard-container" style="margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 10px;">
      <h3>Scoreboard</h3>
      <div id="scoreboard"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
