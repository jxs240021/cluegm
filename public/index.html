<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Word Game</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f7fafc; margin: 0; padding: 20px; color: #2d3748; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto 20px; }
    .btn { background: #3182ce; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; }
    .btn:hover { background: #2b6cb0; }
    .btn-warning { background: #dd6b20; }
    .btn-warning:hover { background: #c05621; }
    .btn-category { width: 100%; text-align: left; background: #edf2f7; border: 1px solid #cbd5e0; padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-category:hover { background: #e2e8f0; }
    input[type="text"] { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; width: calc(100% - 24px); margin-bottom: 12px; }
    .clue-item { padding: 8px 12px; background: #edf2f7; border-radius: 6px; margin-bottom: 6px; }
    .clue-item.invalid { text-decoration: line-through; opacity: 0.5; background: #fed7d7; }
  </style>
</head>
<body>

  <div class="card" id="join-screen">
    <h2>Welcome to Just One!</h2>
    <input type="text" id="player-name" placeholder="Enter Your Name">
    <div>
      <button class="btn" id="create-btn">Create Room</button>
    </div>
    <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">
    <input type="text" id="room-input" placeholder="Room Code (e.g. ABCD)">
    <button class="btn" id="join-btn">Join Room</button>
  </div>

  <div class="card" id="game-screen" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3>Room Code: <span id="room-code-display"></span></h3>
      <button class="btn" id="copy-link-btn" style="padding: 6px 12px; font-size: 12px;">📋 Copy Link</button>
    </div>
    <p id="player-name-badge" style="font-weight: bold; color: #4a5568;"></p>
    <p id="role-display" style="color: #718096; font-style: italic;"></p>

    <!-- Lobby View -->
    <div id="lobby-list-container">
      <h4>Players in Room:</h4>
      <ul id="lobby-player-list"></ul>
      <button class="btn" id="start-game-btn" style="display: none;">🚀 Start Game</button>
    </div>

    <!-- Phase 0: Select Category -->
    <div id="selecting-category-view" style="display: none;">
      <h3 id="category-picker-title">Pick a Category</h3>
      <p id="category-instruction-text"></p>
      <div id="category-buttons-container"></div>
    </div>

    <!-- Phase 1: Submit Clues -->
    <div id="submitting-clues-view" style="display: none;">
      <h3 id="category-badge-display"></h3>
      <h2 id="target-word-display" style="color: #2b6cb0;"></h2>
      
      <button class="btn btn-warning" id="skip-word-btn" style="display: none; margin-bottom: 12px;">🔄 Skip / Pick New Word</button>

      <div id="clue-input-box">
        <input type="text" id="clue-input" placeholder="Enter a single-word clue">
        <button class="btn" id="submit-clue-btn">Submit Clue</button>
      </div>
      <p id="waiting-clues-msg" style="color: #718096;"></p>
    </div>

    <!-- Phase 2: Review Clues (Moderator) -->
    <div id="reviewing-clues-view" style="display: none;">
      <h3>Review Clues</h3>
      <p id="mod-instruction-text"></p>
      <div id="moderator-clue-list"></div>
      <button class="btn" id="approve-clues-btn" style="margin-top: 12px;">Send Clues to Guesser</button>
    </div>

    <!-- Phase 3: Guessing View -->
    <div id="guessing-view" style="display: none;">
      <h3>Clues Revealed!</h3>
      <ul id="guesser-clue-list" style="list-style: none; padding: 0;"></ul>
      
      <div id="guesser-input-box">
        <input type="text" id="guess-input" placeholder="Enter your final guess">
        <button class="btn" id="submit-guess-btn">Submit Guess</button>
      </div>
    </div>

    <!-- Phase 4: Round Over View -->
    <div id="round-over-view" style="display: none;">
      <h2 id="result-status"></h2>
      <p>Target Word: <strong id="reveal-target"></strong></p>
      <p>Submitted Guess: <strong id="reveal-guess"></strong></p>
      <button class="btn" id="next-round-btn">Next Round ➡️</button>
    </div>

    <!-- Scoreboard View -->
    <div id="scoreboard-container" style="display: none; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 12px;">
      <h4>Scoreboard</h4>
      <div id="scoreboard"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
